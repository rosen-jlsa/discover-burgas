    <radialGradient id="glow"><stop stop-color="#54f3dc" stop-opacity=".45"/><stop offset="1" stop-color="#54f3dc" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="600" rx="38" fill="url(#bg)"/>
